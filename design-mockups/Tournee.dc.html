<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Vollkorn:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Special+Elite&display=swap');
  :root{
    --ink: oklch(24% 0.035 55);
    --ink-muted: oklch(45% 0.035 60);
    --ink-faint: oklch(62% 0.03 65);
    --paper: oklch(93% 0.025 85);
    --paper-alt: oklch(89% 0.03 80);
    --desk: oklch(24% 0.02 60);
    --rust: oklch(48% 0.13 45);
    --moss: oklch(46% 0.11 145);
    --stampred: oklch(46% 0.14 25);
    --line: oklch(24% 0.035 55 / 0.22);
    --line-strong: oklch(24% 0.035 55 / 0.45);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Vollkorn', Georgia, serif; color:var(--ink);}
  a{color:var(--rust);} a:hover{color:var(--stampred);}
  .wordmark{font-family:'IM Fell English SC', Georgia, serif; letter-spacing:0.08em;}
  .action-btn{display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 10px; border:1.5px solid var(--line-strong); background:var(--paper); flex:1;}
  .action-btn .lbl{font-size:12px; font-style:italic; color:var(--ink-muted);}
</style>
</helmet>

<div style="min-height:1000px; background:var(--desk); display:flex; flex-direction:column; align-items:center; padding:36px 24px;">

  <div style="width:100%; max-width:560px; display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;">
    <div style="color:var(--paper-alt); font-family:'Special Elite',monospace; font-size:13px; opacity:0.8;">&times;&nbsp;&nbsp;Quitter la tourn&eacute;e</div>
    <div style="color:var(--paper-alt); font-family:'Special Elite',monospace; font-size:13px; opacity:0.8;">BAC 5 / 24</div>
  </div>
  <div style="width:100%; max-width:560px; height:4px; background:rgba(255,255,255,0.12); margin-bottom:34px;">
    <div style="width:20.8%; height:100%; background:var(--rust);"></div>
  </div>

  <div style="position:relative; width:100%; max-width:560px;">
    <div style="position:absolute; inset:0; background:var(--paper-alt); border:1px solid var(--line); transform:rotate(3deg) translateY(10px); box-shadow:0 10px 20px rgba(0,0,0,0.3);"></div>
    <div style="position:absolute; inset:0; background:var(--paper-alt); border:1px solid var(--line); transform:rotate(-2deg) translateY(5px); box-shadow:0 10px 20px rgba(0,0,0,0.3);"></div>

    <div style="position:relative; background:var(--paper); border:1.5px solid var(--ink); padding:32px; box-shadow:0 18px 40px rgba(0,0,0,0.45);">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;">
        <div style="color:var(--rust);"><svg viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 24c0-8 6-13 14-13s14 5 14 13-6 13-14 13-14-5-14-13z"/><path d="M12 18h24M10 24h28M12 30h24"/><path d="M8 20l-4-2M8 24l-5 0M8 28l-4 2M40 20l4-2M40 24l5 0M40 28l4 2"/><path d="M20 37l-3 4M28 37l3 4"/></svg></div>
        <div style="font-family:'Special Elite',monospace; font-size:10px; color:var(--ink-faint);">n&#176; 009</div>
      </div>
      <div class="wordmark" style="font-size:22px;">Cloporte Dairy Cow</div>
      <div style="font-style:italic; color:var(--ink-muted); font-size:13.5px; margin-bottom:6px;">Porcellio laevis 'Dairy Cow'</div>
      <div style="font-family:'Special Elite',monospace; font-size:10.5px; color:var(--ink-faint); margin-bottom:22px;">dernière v&eacute;rification : il y a 6 jours</div>

      <div style="display:flex; gap:10px; margin-bottom:14px;">
        <div class="action-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c8 0 14-6 14-14-8 0-14 6-14 14z"/><path d="M5 19c3-6 6-9 11-11"/></svg>
          <div class="lbl">Nourri</div>
        </div>
        <div class="action-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-4M4 20h4v-4M20 4l-4 4M20 4h-4v4"/><path d="M9 15l6-6"/></svg>
          <div class="lbl">Nettoy&eacute;</div>
        </div>
        <div class="action-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6"/><path d="M6 12c1.5 2 3.5 2 6 0s4.5-2 6 0"/></svg>
          <div class="lbl">Mue</div>
        </div>
        <div class="action-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--moss)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          <div class="lbl">RAS</div>
        </div>
      </div>
      <div style="text-align:center; font-style:italic; color:var(--ink-muted); font-size:12.5px; padding-top:10px; border-top:1px dashed var(--line);">+ ajouter une note ou une photo</div>
    </div>
  </div>

  <div style="margin-top:28px; color:var(--paper-alt); opacity:0.65; font-size:12.5px; font-style:italic; text-align:center;">Glisse ou tape une action pour passer au bac suivant &mdash; <span style="text-decoration:underline; cursor:pointer;">passer ce bac</span></div>
</div>
</x-dc>
</body>
</html>
